<!doctype html><meta charset="utf-8"><title>Directional lightmap GPU checks</title>
<canvas id="canvas" width="128" height="64" style="width:512px;height:256px"></canvas><pre id="result">Running GPU checks...</pre>
<script type="module">
import {Engine,Scene,UniversalCamera,Vector3,MeshBuilder,PBRMaterial,RawTexture,Texture,VertexBuffer,Color3} from '@babylonjs/core';
import {DirectionalLightmapPlugin} from '/src/directional-lightmap.ts';
try {
 const engine=new Engine(document.querySelector('canvas'),false,{preserveDrawingBuffer:true});
 const scene=new Scene(engine);scene.imageProcessingConfiguration.isEnabled=false;
 const camera=new UniversalCamera('camera',new Vector3(0,0,-3),scene);camera.setTarget(Vector3.Zero());
 const plane=MeshBuilder.CreatePlane('plane',{width:4,height:2},scene);
 plane.setVerticesData(VertexBuffer.UV2Kind,plane.getVerticesData(VertexBuffer.UVKind));
 const material=new PBRMaterial('test',scene);plane.material=material;material.backFaceCulling=false;
 material.albedoColor=Color3.White();material.metallic=0;material.roughness=1;
 const texture=(data,w=1)=>{const t=RawTexture.CreateRGBTexture(new Uint8Array(data),w,1,scene,false,false,Texture.NEAREST_SAMPLINGMODE);t.gammaSpace=false;return t;};
 material.lightmapTexture=texture([100,100,100]);material.lightmapTexture.coordinatesIndex=1;
 material.bumpTexture=texture([128,128,255,204,128,230],2);
 const directionTexture=texture([204,128,26]);
 const plugin=new DirectionalLightmapPlugin(material,directionTexture);
 engine.runRenderLoop(()=>scene.render());await scene.whenReadyAsync();
 const sample=async(strength,rotation=0,mirror=false)=>{
  plugin.strength=strength;plane.rotation.y=rotation;plane.scaling.x=mirror?-1:1;material.invertNormalMapX=mirror;camera.position.set(-3*Math.sin(rotation),0,-3*Math.cos(rotation));camera.setTarget(Vector3.Zero());
  for(let i=0;i<4;i++)await new Promise(requestAnimationFrame);
  const w=engine.getRenderWidth(),h=engine.getRenderHeight();
  const a=new Uint8Array((await engine.readPixels(0,0,w,h)).buffer);
  return [a[(Math.floor(h/2)*w+Math.floor(w*.3))*4],a[(Math.floor(h/2)*w+Math.floor(w*.7))*4]];
 };
 const off=await sample(0),on=await sample(1),rotated=await sample(1,0.7),mirrored=await sample(1,0,true),offAgain=await sample(0);
 directionTexture.update(new Uint8Array([128,128,128]));
 const neutral=await sample(1);
 const checks={off,on,rotated,mirrored,offAgain,neutral,neutralPreservesBaseline:off.every((x,i)=>Math.abs(x-neutral[i])<=1),mirrorPreserved:on.every((x,i)=>Math.abs(x-mirrored[1-i])<=2),flatNormalPreserved:Math.abs(off[0]-on[0])<=2,normalDetailResponds:Math.abs(off[1]-on[1])>=5,rotationPreserved:on.every((x,i)=>Math.abs(x-rotated[i])<=2),toggleRestoresBaseline:off.every((x,i)=>Math.abs(x-offAgain[i])<=1)};
 engine.stopRenderLoop();
 if(!checks.neutralPreservesBaseline||!checks.mirrorPreserved||!checks.flatNormalPreserved||!checks.normalDetailResponds||!checks.rotationPreserved||!checks.toggleRestoresBaseline)throw Error(JSON.stringify(checks));
 document.querySelector('#result').textContent='PASS\n'+JSON.stringify(checks,null,2);
} catch(error) {document.querySelector('#result').textContent='FAIL\n'+error.stack;}
</script>
